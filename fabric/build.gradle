plugins {
    id 'java-library'
    id 'fabric-loom'
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.fabricmc.net' }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.17.2"
    // Mixin 注解处理器：mojmap 源码编译 + remapJar 重映射
    annotationProcessor 'net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7'
    implementation project(':common')
    implementation "io.netty:netty-common:4.1.97.Final"
    implementation "io.netty:netty-buffer:4.1.97.Final"
    implementation "io.netty:netty-transport:4.1.97.Final"
    implementation "io.netty:netty-handler:4.1.97.Final"
}

// MC 运行时不提供 toml4j/night-config（gson 由 MC 提供）：配置库只解析自身，
// 随 mod jar 打包，避免触发整个 runtimeClasspath 的解析。
configurations {
    libBundle {
        // gson 由 MC 运行时提供，不随 jar 打包。
        transitive = false
    }
}

dependencies {
    libBundle "com.moandjiezana.toml:toml4j:0.7.2"
    libBundle "com.electronwill.night-config:core:3.9.0"
    libBundle "com.electronwill.night-config:toml:3.9.0"
}

def libBundleTrees = files(configurations.libBundle.files.collect { zipTree(it) })

processResources {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

def cdylibDir = rootProject.layout.buildDirectory.dir('native')

tasks.named('jar') {
    dependsOn(rootProject.tasks.named('buildCdylib'))
    from(cdylibDir) { into 'native/' }
    from(project(':common').sourceSets.main.output)
    from(libBundleTrees) {
        exclude 'META-INF/**'
    }
}
