[package]
name = "qmc-native"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "qmc_native"
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[dependencies]
# Runtime
jni = "0.21"
tokio = { version = "1", features = ["full"] }

# Record
dashmap = "6"

# Connection
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = "0.11"
quinn-plaintext = "0.3"

[profile.release]
opt-level = 3
lto = true
