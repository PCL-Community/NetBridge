[versions]
minecraft = "1.21.1"
neoforge = "21.1.183"
neoforge-moddev = "1.0.11"
fabric-loom = "1.17.19"
fabric-loader = "0.17.2"
mixin = "0.15.2+mixin.0.8.7"

netty = "4.1.97.Final"
slf4j = "2.0.13"
gson = "2.10.1"
night-config = "3.9.0"
toml4j = "0.7.2"

junit = "6.1.3"

jspecify = "1.0.1"
nullaway = "0.13.8"
errorprone-gradle = "5.1.0"
nullaway-gradle = "3.1.0"
foojay-resolver = "0.9.0"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }

slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
toml4j = { module = "com.moandjiezana.toml:toml4j", version.ref = "toml4j" }
nightconfig-core = { module = "com.electronwill.night-config:core", version.ref = "night-config" }
nightconfig-toml = { module = "com.electronwill.night-config:toml", version.ref = "night-config" }

netty-common = { module = "io.netty:netty-common", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine" }
junit-platform-commons = { module = "org.junit.platform:junit-platform-commons" }
junit-platform-console = { module = "org.junit.platform:junit-platform-console", version.ref = "junit" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[bundles]
netty = ["netty-common", "netty-buffer", "netty-transport", "netty-handler"]
nightconfig = ["nightconfig-core", "nightconfig-toml"]

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-gradle" }
nullaway = { id = "net.ltgt.nullaway", version.ref = "nullaway-gradle" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
