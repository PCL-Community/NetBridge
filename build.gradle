plugins {
    id 'net.neoforged.moddev' version '1.0.11' apply false
    id 'fabric-loom' version "${loomVersion}" apply false
}

allprojects {
    group = mavenGroup
    version = modVersion
}

// --- Rust cdylib 集成（根项目统一构建，ADR-0006 决策 4） ---
def cargoDir = file('rust/qmc-native')
def cdylibDir = file("$buildDir/native")

tasks.register('buildCdylib') {
    doLast {
        cdylibDir.mkdirs()
        def pb = new ProcessBuilder('cargo', 'build')
        pb.directory(cargoDir)
        def proc = pb.start()
        def code = proc.waitFor()
        if (code != 0) {
            throw new GradleException("cargo build failed with exit code " + code)
        }
        def src = file('rust/qmc-native/target/debug/libqmc_native.so')
        if (!src.exists()) {
            throw new GradleException("Rust cdylib not found after cargo build: ${src}")
        }
        def dst = file("${cdylibDir}/${src.name}")
        dst.createNewFile()
        src.withInputStream { inp -> dst.withOutputStream { out -> out.write(inp.readAllBytes()) } }
        println "copied native: ${src} -> ${dst}"
    }
}

// --- 产物聚合（ADR-0006 决策 5）：双平台 jar 收集到根 build/libs/ ---
def rootLibs = layout.buildDirectory.dir('libs')

tasks.register('assembleAll') {
    group = 'build'
    description = 'Assemble both platform mod jars into root build/libs/.'
    dependsOn tasks.named('buildCdylib')
    dependsOn ':neoforge:jarNeoForge'
    dependsOn ':fabric:remapJar'
    doLast {
        copy {
            from project(':neoforge').layout.buildDirectory.file("libs/qmc-neoforge-${modVersion}.jar")
            into rootLibs
        }
        copy {
            from project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile }
            rename { "qmc-fabric-${modVersion}.jar" }
            into rootLibs
        }
    }
}

tasks.register('printVersions') {
    doLast {
        println "Minecraft: ${minecraftVersion} (NeoForge ${neoForgeVersion} / Fabric ${minecraftVersion})"
    }
}
