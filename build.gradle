import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.StandardCopyOption

plugins {
    id 'net.neoforged.moddev' version '1.0.11' apply false
    id 'fabric-loom' version "${loomVersion}" apply false
}

allprojects {
    group = mavenGroup
    version = modVersion
}

// --- Rust cdylib 集成（根项目统一构建） ---
// -PnativeProfile=debug|release 选择 cargo profile（默认 debug）。
def nativeProfile = (findProperty('nativeProfile') ?: 'debug').toString()
if (!(nativeProfile in ['debug', 'release'])) {
    throw new GradleException("nativeProfile must be debug or release, got: ${nativeProfile}")
}
def cargoDir = file('rust/net-bridge-native')
def cdylibDir = file("$buildDir/native")

// 按当前 OS/架构选择 cargo 产出的 cdylib 文件名与 jar 内子目录
// （与 NativeLoader.platformDir()/nativeResourceName() 一致）。
def osName = System.getProperty('os.name', '').toLowerCase()
def archName = System.getProperty('os.arch', '').toLowerCase()
def cdylibName = osName.contains('win') ? 'net_bridge_native.dll'
        : (osName.contains('mac') || osName.contains('darwin')) ? 'libnet_bridge_native.dylib'
        : 'libnet_bridge_native.so'
def nativeOsDir = osName.contains('win') ? 'windows'
        : (osName.contains('mac') || osName.contains('darwin')) ? 'macos' : 'linux'
def nativeArchDir = (archName in ['x86_64', 'amd64']) ? 'x86_64' : (archName in ['aarch64', 'arm64']) ? 'aarch64' : archName
def nativeSubdir = "${nativeOsDir}-${nativeArchDir}"
// 供子项目（:common 测试 java.library.path）引用。
ext.nativeSubdir = nativeSubdir

tasks.register('buildCdylib') {
    // CI 预置三平台库到 build/native 后可用 -PskipNativeBuild 跳过本机 cargo 构建。
    onlyIf { !project.hasProperty('skipNativeBuild') }
    doLast {
        cdylibDir.mkdirs()
        def cargoArgs = ['cargo', 'build']
        if (nativeProfile == 'release') {
            cargoArgs << '--release'
        }
        def pb = new ProcessBuilder(cargoArgs)
        pb.directory(cargoDir)
        pb.inheritIO()
        def proc = pb.start()
        def code = proc.waitFor()
        if (code != 0) {
            throw new GradleException("cargo build failed with exit code " + code)
        }
        def src = file("rust/net-bridge-native/target/${nativeProfile}/${cdylibName}")
        if (!src.exists()) {
            throw new GradleException("Rust cdylib not found after cargo build: ${src}")
        }
        def dstDir = new File(cdylibDir, nativeSubdir)
        dstDir.mkdirs()
        def dst = new File(dstDir, src.name)
        Files.copy(src.toPath(), dst.toPath(), StandardCopyOption.REPLACE_EXISTING)
        println "copied native (${nativeProfile}): ${src} -> ${dst}"
    }
}

// --- 双平台源码副本同步校验（共享 MC 逻辑按平台复制源码） ---
// 副本仅允许 package/import 差异（平台包名不同），其余必须逐字一致。
def syncedCopies = [
    ['mc/NativeClientTransport.java', 'mc/NativeClientTransport.java'],
    ['mc/NativeServerTransport.java', 'mc/NativeServerTransport.java'],
    ['mixin/ClientboundStatusResponsePacketMixin.java', 'mixin/ClientboundStatusResponsePacketMixin.java'],
    ['mixin/ConnectionMixin.java', 'mixin/ConnectionMixin.java'],
    ['mixin/ConnectScreenMixin.java', 'mixin/ConnectScreenMixin.java'],
    ['mixin/DebugScreenOverlayMixin.java', 'mixin/DebugScreenOverlayMixin.java'],
    ['mixin/JoinMultiplayerScreenMixin.java', 'mixin/JoinMultiplayerScreenMixin.java'],
    ['mixin/MinecraftServerLifecycleMixin.java', 'mixin/MinecraftServerLifecycleMixin.java'],
    ['mixin/ServerStatusPingerResponseMixin.java', 'mixin/ServerStatusPingerResponseMixin.java'],
    ['mixin/StatusResponseWriteMixin.java', 'mixin/StatusResponseWriteMixin.java'],
]

tasks.register('checkSyncedCopies') {
    group = 'verification'
    description = 'Verifies fabric/neoforge source copies stay in sync.'
    doLast {
        def base = [
            fabric  : file('fabric/src/main/java/top/tangge233/netbridge/fabric'),
            neoforge: file('neoforge/src/main/java/top/tangge233/netbridge/neoforge'),
        ]
        def normalize = { f -> f.readLines().findAll {
            def t = it.trim()
            t && !(t.startsWith('package ') || t.startsWith('import '))
        }*.trim().join('\n') }
        def failed = []
        syncedCopies.each { rel ->
            def fabFile = new File(base.fabric, rel[0])
            def neoFile = new File(base.neoforge, rel[1])
            if (!fabFile.exists() || !neoFile.exists()) {
                failed << "${rel[0]}: missing (${fabFile.exists() ? 'neoforge' : 'fabric'} side)"
            } else if (normalize(fabFile) != normalize(neoFile)) {
                failed << "${rel[0]}: content diverged between :fabric and :neoforge"
            }
        }
        if (failed) {
            throw new GradleException(
                'Synced source copies out of sync:\n  ' + failed.join('\n  '))
        }
        println "synced copies OK (${syncedCopies.size()} pairs)"
    }
}

// --- 产物聚合：双平台 jar 收集到根 build/libs/ ---
def rootLibs = layout.buildDirectory.dir('libs')

tasks.register('assembleAll') {
    group = 'build'
    description = 'Assemble both platform mod jars into root build/libs/.'
    dependsOn tasks.named('buildCdylib')
    dependsOn tasks.named('checkSyncedCopies')
    dependsOn ':neoforge:jarNeoForge'
    dependsOn ':fabric:remapJar'
    doLast {
        copy {
            from project(':neoforge').layout.buildDirectory.file("libs/net-bridge-neoforge-${modVersion}.jar")
            into rootLibs
        }
        copy {
            from project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile }
            rename { "net-bridge-fabric-${modVersion}.jar" }
            into rootLibs
        }
    }
}

tasks.register('printVersions') {
    doLast {
        println "Minecraft: ${minecraftVersion} (NeoForge ${neoForgeVersion} / Fabric ${minecraftVersion})"
    }
}
