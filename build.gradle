import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.StandardCopyOption

plugins {
    id 'net.neoforged.moddev' version '1.0.11' apply false
    id 'fabric-loom' version "${loomVersion}" apply false
}

allprojects {
    group = mavenGroup
    version = modVersion
}

// --- Rust cdylib 集成（根项目统一构建，ADR-0006 决策 4） ---
def cargoDir = file('rust/qmc-native')
def cdylibDir = file("$buildDir/native")

tasks.register('buildCdylib') {
    doLast {
        cdylibDir.mkdirs()
        def pb = new ProcessBuilder('cargo', 'build')
        pb.directory(cargoDir)
        def proc = pb.start()
        def code = proc.waitFor()
        if (code != 0) {
            throw new GradleException("cargo build failed with exit code " + code)
        }
        def src = file('rust/qmc-native/target/debug/libqmc_native.so')
        if (!src.exists()) {
            throw new GradleException("Rust cdylib not found after cargo build: ${src}")
        }
        def dst = new File(cdylibDir, src.name)
        Files.copy(src.toPath(), dst.toPath(), StandardCopyOption.REPLACE_EXISTING)
        println "copied native: ${src} -> ${dst}"
    }
}

// --- 双平台源码副本同步校验（ADR-0006：共享 MC 逻辑按平台复制源码） ---
// 副本仅允许 package/import 差异（平台包名不同），其余必须逐字一致。
def syncedCopies = [
    ['mc/QuicClientTransport.java', 'mc/QuicClientTransport.java'],
    ['mc/QuicServerTransport.java', 'mc/QuicServerTransport.java'],
    ['mixin/ClientboundStatusResponsePacketMixin.java', 'mixin/ClientboundStatusResponsePacketMixin.java'],
    ['mixin/ConnectionMixin.java', 'mixin/ConnectionMixin.java'],
    ['mixin/JoinMultiplayerScreenMixin.java', 'mixin/JoinMultiplayerScreenMixin.java'],
    ['mixin/ServerStatusPingerResponseMixin.java', 'mixin/ServerStatusPingerResponseMixin.java'],
    ['mixin/StatusResponseWriteMixin.java', 'mixin/StatusResponseWriteMixin.java'],
]

tasks.register('checkSyncedCopies') {
    group = 'verification'
    description = 'Verifies fabric/neoforge source copies stay in sync (ADR-0006).'
    doLast {
        def base = [
            fabric  : file('fabric/src/main/java/top/tangge233/qmc/fabric'),
            neoforge: file('neoforge/src/main/java/top/tangge233/qmc/neoforge'),
        ]
        def normalize = { f -> f.readLines().findAll {
            def t = it.trim()
            t && !(t.startsWith('package ') || t.startsWith('import '))
        }*.trim().join('\n') }
        def failed = []
        syncedCopies.each { rel ->
            def fabFile = new File(base.fabric, rel[0])
            def neoFile = new File(base.neoforge, rel[1])
            if (!fabFile.exists() || !neoFile.exists()) {
                failed << "${rel[0]}: missing (${fabFile.exists() ? 'neoforge' : 'fabric'} side)"
            } else if (normalize(fabFile) != normalize(neoFile)) {
                failed << "${rel[0]}: content diverged between :fabric and :neoforge"
            }
        }
        if (failed) {
            throw new GradleException(
                'Synced source copies out of sync (ADR-0006):\n  ' + failed.join('\n  '))
        }
        println "synced copies OK (${syncedCopies.size()} pairs)"
    }
}

// --- 产物聚合（ADR-0006 决策 5）：双平台 jar 收集到根 build/libs/ ---
def rootLibs = layout.buildDirectory.dir('libs')

tasks.register('assembleAll') {
    group = 'build'
    description = 'Assemble both platform mod jars into root build/libs/.'
    dependsOn tasks.named('buildCdylib')
    dependsOn tasks.named('checkSyncedCopies')
    dependsOn ':neoforge:jarNeoForge'
    dependsOn ':fabric:remapJar'
    doLast {
        copy {
            from project(':neoforge').layout.buildDirectory.file("libs/qmc-neoforge-${modVersion}.jar")
            into rootLibs
        }
        copy {
            from project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile }
            rename { "qmc-fabric-${modVersion}.jar" }
            into rootLibs
        }
    }
}

tasks.register('printVersions') {
    doLast {
        println "Minecraft: ${minecraftVersion} (NeoForge ${neoForgeVersion} / Fabric ${minecraftVersion})"
    }
}
