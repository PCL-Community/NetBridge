name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: native (${{ matrix.dir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # dir = jar 内 native/<os>-<arch>/ 子目录（与 NativeLoader.platformDir() 一致）。
        include:
          - os: ubuntu-latest
            dir: linux-x86_64
            lib: libqmc_native.so
          - os: ubuntu-24.04-arm
            dir: linux-aarch64
            lib: libqmc_native.so
          - os: macos-13
            dir: macos-x86_64
            lib: libqmc_native.dylib
          - os: macos-14
            dir: macos-aarch64
            lib: libqmc_native.dylib
          - os: windows-latest
            dir: windows-x86_64
            lib: qmc_native.dll
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/qmc-native

      - name: Build Rust cdylib
        working-directory: rust/qmc-native
        run: cargo build --release

      # artifact 内保持 <dir>/<lib> 结构；package job merge-multiple 后
      # 恰好还原为 build/native/<dir>/<lib>，Gradle 原样打入 jar。
      - name: Stage native library
        shell: bash
        run: mkdir -p stage/${{ matrix.dir }} && cp rust/qmc-native/target/release/${{ matrix.lib }} stage/${{ matrix.dir }}/

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.dir }}
          path: stage
          if-no-files-found: error

  package:
    name: Package mod jars (all platforms bundled)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      # 五个原生库（3 OS × x86_64/arm64）合并到 build/native/<os>-<arch>/，
      # jar 打包时原样打入，运行时由 NativeLoader 按 OS+架构选择对应库。
      - name: Download all native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/native
          merge-multiple: true

      # 版本取自 tag（vX.Y.Z → X.Y.Z），命令行 -P 覆盖 gradle.properties 的 modVersion，
      # jar 名与 fabric.mod.json 内嵌版本随 tag 走，无需手动同步。
      - name: Assemble mod jars
        run: gradle build assembleAll -PnativeProfile=release -PskipNativeBuild "-PmodVersion=${GITHUB_REF_NAME#v}"

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish immutable release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: dist

      # 两步发布保证 immutable：先以 draft 状态上传全部资产（资产不可变、外部不可见），
      # 再切 draft=false 正式发布。
      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*.jar

      - name: Publish release (draft -> published)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
