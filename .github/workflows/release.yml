name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  java-unit:
    name: Java unit tests (no native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Run pure Java tests
        run: gradle test -PskipNativeBuild

  rust-unit:
    name: Rust unit tests / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace

  abi-check:
    name: ABI / symbol / FFM bootstrap check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build native (release)
        working-directory: rust
        run: cargo build -p net-bridge-native --release

      - name: Verify exported symbols
        run: |
          symbols=$(nm -D rust/target/release/libnet_bridge_native.so | awk '$2 == "T" {print $3}' | grep -v '^_' || true)
          unexpected=$(printf '%s\n' "$symbols" | grep -v '^netbridge_get_api$' || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected exported symbols: $unexpected"
            exit 1
          fi
          echo "exported business symbols: $symbols"

      - name: Verify native header / ABI constants
        run: gradle verifyArchitecture -PskipNativeBuild

      - name: Run FFM bootstrap + integration tests (--illegal-native-access=deny)
        run: gradle :common:nativeIntegrationTest -PnativeProfile=release

  native:
    name: native (${{ matrix.dir }})
    needs: [ java-unit, rust-unit, abi-check ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dir: linux-x86_64
            lib: libnet_bridge_native.so
          - os: ubuntu-24.04-arm
            dir: linux-aarch64
            lib: libnet_bridge_native.so
          - os: macos-latest
            dir: macos-aarch64
            lib: libnet_bridge_native.dylib
          - os: windows-latest
            dir: windows-x86_64
            lib: net_bridge_native.dll
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust cdylib
        working-directory: rust
        run: cargo build -p net-bridge-native --release

      - name: Stage native library
        shell: bash
        run: mkdir -p stage/${{ matrix.dir }} && cp rust/target/release/${{ matrix.lib }} stage/${{ matrix.dir }}/

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.dir }}
          path: stage
          if-no-files-found: error

  package:
    name: Package mod jars (all platforms bundled)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Download all native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: build/native
          merge-multiple: true

      - name: Assemble mod jars (includes manifest + architecture guards)
        run: gradle build assembleAll -PnativeProfile=release -PskipNativeBuild "-PmodVersion=${GITHUB_REF_NAME#v}"

      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish immutable release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download mod jars
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: dist

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*.jar

      - name: Publish release (draft -> published)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
