plugins {
    id 'java-library'
}

// 纯 Java + Netty + gson，零 Minecraft 依赖。
repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // SLF4J API：与 MC 自带的日志门面一致（运行时由 MC 提供 log4j 后端）。
    implementation "org.slf4j:slf4j-api:2.0.13"
    implementation "com.google.code.gson:gson:2.10.1"
    // TOML 配置解析/写出：MC 运行时不提供，平台 jar 需显式打包（见各平台 jar 任务）。
    api "com.moandjiezana.toml:toml4j:0.7.2"
    // NightConfig：server.toml 的注释化读写与默认配置生成。
    api "com.electronwill.night-config:toml:3.9.0"
    // 与 MC 1.21.1 内置 Netty 版本一致（QuicChannel 适配器用）。
    implementation "io.netty:netty-common:4.1.97.Final"
    implementation "io.netty:netty-buffer:4.1.97.Final"
    implementation "io.netty:netty-transport:4.1.97.Final"
    implementation "io.netty:netty-handler:4.1.97.Final"

    def junitVersion = '5.11.0'
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testImplementation "org.junit.platform:junit-platform-launcher:1.11.0"
    testImplementation "org.junit.platform:junit-platform-engine:1.11.0"
    testImplementation "org.junit.platform:junit-platform-commons:1.11.0"
    testRuntimeOnly "org.junit.platform:junit-platform-console:1.11.0"
    testRuntimeOnly "org.slf4j:slf4j-nop:2.0.13"
}

def cdylibDir = rootProject.layout.buildDirectory.dir('native')

tasks.named('test') {
    useJUnitPlatform()
    dependsOn(rootProject.tasks.named('buildCdylib'))
    jvmArgs("-Djava.library.path=${cdylibDir.get().asFile}/${rootProject.ext.nativeSubdir}")
    // JDK 24+：放行 JNI 加载（System::loadLibrary）并静音 netty 的 sun.misc.Unsafe
    // 弃用告警。两选项 JDK 21 不识别（worker JVM 拒启），按当前 JDK 版本条件加。
    if (JavaVersion.current().majorVersion.toInteger() >= 24) {
        jvmArgs("--enable-native-access=ALL-UNNAMED", "--sun-misc-unsafe-memory-access=allow")
    }
}

tasks.named('jar') {
    from(cdylibDir) { into 'native/' }
}