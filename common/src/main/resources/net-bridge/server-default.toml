# net-bridge 服务端配置（首次启动自动生成本文件，可直接编辑）

[quic]

# 是否启用 QUIC 传输
enable = true

# QUIC 监听端口：-1 跟随 Minecraft TCP 端口；0 随机分配（实际端口见启动日志）；1-65535 固定端口
port = -1

# 下发进列表 Ping 的地址：留空 = 跟随服务器地址（客户端直连你公开的 IP/域名时保持留空）
host = ""

# QUIC 监听地址：空 = 跟随 server.properties 的 server-ip（再回退全部网卡）；
# IP 字面量（如 "0.0.0.0"、"::1"）限定单网卡
bind = ""

# 本传输最大并发连接数（超限的新连接被静默丢弃，防 UDP 反射滥用）
max_connection = 256

[kcp]

# 是否启用 KCP 传输（默认关闭，按需启用）
enable = false

# KCP 监听端口：-1 = Minecraft TCP 端口 + 1；其余语义与 quic.port 一致
port = -1

# 下发进列表 Ping 的地址：留空 = 跟随服务器地址
host = ""

# 监听地址，语义同 [quic] bind
bind = ""

# 本传输最大并发连接数
max_connection = 256

# 参数档：balance（默认）/ aggressive（高丢包链路换延迟）
profile = "balance"
