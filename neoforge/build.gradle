plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.neoforged.net' }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation project(':common')
    implementation "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"
}

// NeoForge 运行时自带 night-config（JPMS 模块 com.electronwill.nightconfig.*），
// 再打包会触发 split package 冲突（ResolutionException）；gson/toml4j 由本 jar 提供，
// 其中 gson 实际由 MC 运行时提供，不随 jar 打包。
configurations {
    libBundle {
        // gson 由 MC 运行时提供，不随 jar 打包。
        transitive = false
    }
}

dependencies {
    libBundle "com.moandjiezana.toml:toml4j:0.7.2"
}

def libBundleTrees = files(configurations.libBundle.files.collect { zipTree(it) })

neoForge {
    version = neoForgeVersion
    validateAccessTransformers = true
    mods {
        netbridge {
            sourceSet sourceSets.main
        }
    }
}

def cdylibDir = rootProject.layout.buildDirectory.dir('native')

tasks.register('jarNeoForge', Jar) {
    dependsOn(rootProject.tasks.named('buildCdylib'))
    archiveFileName = "net-bridge-neoforge-${modVersion}.jar"
    from(sourceSets.main.output)
    from(project(':common').sourceSets.main.output)
    from(cdylibDir) { into 'native/' }
    from(libBundleTrees) {
        exclude 'META-INF/**'
    }
}
