plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.neoforged.net' }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation project(':common')
    implementation "net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7"
}

// MC 运行时不提供 toml4j（gson 由 MC 提供）：独立配置只解析 toml4j 自身，
// 随 mod jar 打包，避免触发整个 runtimeClasspath 的解析。
configurations {
    toml4jBundle {
        // gson 由 MC 运行时提供，不随 jar 打包。
        transitive = false
    }
}

dependencies {
    toml4jBundle "com.moandjiezana.toml:toml4j:0.7.2"
}

def toml4jTrees = files(configurations.toml4jBundle.files.collect { zipTree(it) })

neoForge {
    version = neoForgeVersion
    validateAccessTransformers = true
    mods {
        qmc {
            sourceSet sourceSets.main
        }
    }
}

def cdylibDir = rootProject.layout.buildDirectory.dir('native')

tasks.register('jarNeoForge', Jar) {
    dependsOn(rootProject.tasks.named('buildCdylib'))
    archiveFileName = "qmc-neoforge-${modVersion}.jar"
    from(sourceSets.main.output)
    from(project(':common').sourceSets.main.output)
    from(cdylibDir) { into 'native/' }
    from(toml4jTrees) {
        exclude 'META-INF/**'
    }
}
